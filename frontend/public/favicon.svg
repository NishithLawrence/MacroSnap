<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171A20"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="rev-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="rev-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D5A"/>
      <stop offset="100%" stop-color="#EF233C"/>
    </linearGradient>
    <filter id="red-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect width="64" height="64" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <g transform="translate(6, 6) scale(1.3)">
    <!-- Stem -->
    <path d="M 9 8.5 C 8.45 8.5 8 8.95 8 9.5 L 8 30.5 C 8 31.05 8.45 31.5 9 31.5 L 14 31.5 C 14.55 31.5 15 31.05 15 30.5 L 15 9.5 C 15 8.95 14.55 8.5 14 8.5 Z" fill="url(#rev-silver)"/>
    <!-- Upper Loop -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="M 14 8.5 L 24.5 8.5 C 28.92 8.5 32.5 11.63 32.5 15.5 C 32.5 19.37 28.92 22.5 24.5 22.5 L 14 22.5 L 14 8.5 Z M 19 12.8 L 24 12.8 C 25.66 12.8 27 13.92 27 15.5 C 27 17.08 25.66 18.2 24 18.2 L 19 18.2 L 19 12.8 Z" fill="url(#rev-silver)"/>
    <!-- Dynamic Speed Blade (Kick) -->
    <path d="M 18.5 19.8 L 24 19.8 L 32.3 31.2 C 32.7 31.7 32.3 32 31.6 32 L 26.2 32 C 25.6 32 25.1 31.6 24.7 31.1 L 18.5 22 Z" fill="url(#rev-red)" filter="url(#red-glow)"/>
  </g>
</svg>